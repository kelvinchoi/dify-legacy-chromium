name: 功能请求
description: 新增补丁、扩大内核支持范围或改进脚本
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请确认这不是上游 Dify 自身的功能需求 —— 本仓库只做老内核兼容，不新增产品功能。

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 你遇到的具体问题，以及为什么现有补丁解决不了。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望仓库提供什么 —— 新补丁、脚本参数、文档补充，都可以。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 语法 / JS API（polyfill）
        - CSS 降级（@layer、translate、dvh、color-mix）
        - wasm 与模块加载
        - 静态资源与子路径部署
        - 脚本与 CI
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有试过其它做法，为什么不行。

  - type: textarea
    id: environment
    attributes:
      label: 环境信息（可选）
      description: 内核版本、Dify 版本、部署路径。与兼容性相关的需求请务必填写。
      placeholder: Chromium 90.0.4430.246 / Dify 1.15.0 / 子路径 /dify
